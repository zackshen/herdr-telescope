[package]
name = "herdr-telescope"
version = "0.1.1"
edition = "2021"
description = "fzf command telescope for herdr: built-in native actions + every installed plugin's actions, plus a file finder that opens a result in a new pane or window."
license = "MIT"
rust-version = "1.70"
repository = "https://github.com/zackshen/herdr-telescope"

[[bin]]
name = "herdr-telescope"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
